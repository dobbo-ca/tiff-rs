[package]
name = "tiff-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tiff = { path = "../.." }

# Not part of the root package: only this crate may depend on libfuzzer-sys.
[workspace]

[[bin]]
name = "open_decode"
path = "fuzz_targets/open_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_chunk"
path = "fuzz_targets/codec_chunk.rs"
test = false
doc = false
bench = false

