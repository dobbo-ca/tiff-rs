test = false
doc = false
bench = false

[[bin]]
name = "limits"
path = "fuzz_targets/limits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "readat"
path = "fuzz_targets/readat.rs"
test = false
doc = false
bench = false

[[bin]]
